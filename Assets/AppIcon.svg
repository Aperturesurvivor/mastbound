<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Mastbound app icon. macOS grid: 824x824 tile at 100,100, corner radius 185. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F2024"/>
      <stop offset="1" stop-color="#0E0F11"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <!-- rope rings, back halves -->
  <g fill="none" stroke="#4E8F7D" stroke-width="46" stroke-linecap="round">
    <path d="M292 470 A220 74 0 0 1 732 470"/>
    <path d="M292 590 A220 74 0 0 1 732 590"/>
  </g>
  <!-- mast -->
  <rect x="482" y="210" width="60" height="604" rx="30" fill="#F2F2F3"/>
  <!-- rope rings, front halves -->
  <g fill="none" stroke="#7ED1B8" stroke-width="46" stroke-linecap="round">
    <path d="M292 470 A220 74 0 0 0 732 470"/>
    <path d="M292 590 A220 74 0 0 0 732 590"/>
  </g>
</svg>
